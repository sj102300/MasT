# MasT 설정 예시. config.yaml 로 복사해서 사용.
#   Windows:  copy config.example.yaml config.yaml
#   Linux:    cp config.example.yaml config.yaml

llm:
  # anthropic      : Claude API (공식 SDK)
  # openai_compat  : OpenAI 호환 API (사내 LLM 게이트웨이)
  provider: anthropic
  model: claude-opus-5-5
  # API 키는 파일에 쓰지 말고 환경변수로 지정
  #   PowerShell: $env:ANTHROPIC_API_KEY = "sk-..."
  #   bash:       export ANTHROPIC_API_KEY=sk-...
  api_key_env: ANTHROPIC_API_KEY
  base_url: null
  max_tokens: 32000
  timeout_sec: 600
  max_retries: 2
  effort: high          # anthropic 전용: low | medium | high | xhigh | max
  fallbacks: default    # anthropic 전용: 모델이 요청을 거절하면 서버가 대체 모델로 재시도. 끄려면 null
  temperature: 0.2      # openai_compat 전용
  ca_bundle: null       # 사내 인증서 경로 (예: C:\certs\corp-ca.pem)
  verify_ssl: true
  proxy: null           # 예: http://proxy.corp:8080 (null이면 환경변수 HTTPS_PROXY 사용)

# 사내 LLM 사용 예:
# llm:
#   provider: openai_compat
#   model: corp-llm-70b
#   api_key_env: CORP_LLM_API_KEY
#   base_url: https://llm.corp.example/v1
#   temperature: 0.2

# 에이전트별 덮어쓰기 (planner, writer, fixer). 지정하지 않은 항목은 llm 값을 따름.
agents: {}
#  fixer:
#    model: claude-opus-5-5
#    effort: xhigh

run:
  output_dir: runs
  framework: gtest
  language: Korean      # 테스트 설명/리포트 언어
  max_fix_iterations: 3
  test_timeout_sec: 120
  build_timeout_sec: 1800

build:
  # auto: --project가 .vcxproj면 msbuild, 디렉터리면 (Windows: vcxproj 있으면 msbuild / 그 외 CMake)
  system: auto            # auto | cmake | vcxproj
  configuration: Debug
  platform: x64
  toolset: null           # vcxproj: PlatformToolset 덮어쓰기 (VS2022만 있으면 v143)
  msbuild_path: null      # null이면 PATH → vswhere 순으로 자동 탐색
  cmake_target: null      # cmake: 제품 CMakeLists의 라이브러리 타깃에 링크 (예: calculator_lib)
  cmake_generator: null   # 예: "Ninja", "Visual Studio 16 2019"
  cmake_args: []
  # 제품 소스를 직접 컴파일할 때 사용할 소스 glob (프로젝트 루트 기준).
  # 비우면 vcxproj의 ClCompile 목록, CMake는 루트 아래 모든 C++ 소스(main 있는 파일 제외)
  sources: []
  exclude: ["build/**", "out/**", "**/test/**", "**/tests/**", "**/third_party/**"]
  include_dirs: []        # 추가 include 경로
  defines: []             # 추가 전처리기 정의
  libs: []                # 추가 링크 라이브러리
  lib_dirs: []
  # googletest 소스. 사내망에서 다운로드가 막히면 미리 받아둔 경로 지정
  gtest_source_dir: null
  gtest_url: https://github.com/google/googletest/archive/refs/tags/v1.17.0.zip
  cache_dir: ~/.mast/cache
  ca_bundle: null
