[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mast"
version = "0.1.0"
description = "Multi-agent system that generates and verifies C++ unit tests (googletest)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.14",
    "openai>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
mast = "mast.cli:app"

[tool.setuptools.packages.find]
include = ["mast*"]

[tool.setuptools.package-data]
mast = ["prompts/*.md", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
